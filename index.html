<!qDOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #eef8ff, #ffffff);
    color: #07194d;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding-bottom: 35px;
}

.hero {
    height: 300px;
    background: linear-gradient(145deg, #007aff, #dff3ff);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0 0 45px 45px;
    position: relative;
    overflow: hidden;
}

.hero::before,
.hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
}

.hero::before {
    width: 330px;
    height: 330px;
}

.hero::after {
    width: 230px;
    height: 230px;
}

.whatsapp {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #25D366;
    border: 10px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 78px;
    font-weight: bold;
    z-index: 2;
    box-shadow: 0 15px 40px rgba(0,0,0,.18);
}

.form {
    padding: 25px 20px;
}

label {
    display: block;
    font-size: 20px;
    font-weight: 700;
    margin: 15px 4px 9px;
}

.input {
    width: 100%;
    height: 62px;
    border: 2px solid #087cff;
    border-radius: 18px;
    background: white;
    padding: 0 20px;
    font-size: 18px;
    outline: none;
}

.refund {
    margin-top: 25px;
    padding: 25px 18px;
    border-radius: 28px;
    background: linear-gradient(145deg,#eaf8ff,#ffffff);
    box-shadow: 0 10px 35px rgba(0,100,220,.10);
}

.title {
    text-align: center;
    font-size: 27px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 22px;
}

.blue {
    color: #087cff;
}

.calculation {
    display: flex;
    align-items: center;
    gap: 8px;
}

.box {
    flex: 1;
    min-height: 120px;
    background: white;
    border-radius: 20px;
    padding: 18px 8px;
    text-align: center;
}

.box strong {
    display: block;
    font-size: 27px;
    margin-top: 10px;
}

.percent {
    font-size: 24px;
    font-weight: 800;
    color: #087cff;
    text-align: center;
}

.note {
    margin-top: 22px;
    padding: 15px;
    border-radius: 16px;
    background: #f5fbff;
    font-size: 16px;
    line-height: 1.45;
    text-align: center;
}

.disabled {
    background: #f3f3f3;
    color: #999;
    cursor: not-allowed;
}

.ok {
    width: 100%;
    height: 65px;
    margin-top: 25px;
    border: 0;
    border-radius: 20px;
    background: linear-gradient(90deg,#087cff,#0064d9);
    color: white;
    font-size: 28px;
    font-weight: 800;
    cursor: pointer;
}

.ok:active {
    transform: scale(.98);
}

@media(max-width:380px) {
    .title {
        font-size: 23px;
    }

    .box strong {
        font-size: 23px;
    }

    .whatsapp {
        width: 130px;
        height: 130px;
        font-size: 65px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="hero">
        <div class="whatsapp">☎</div>
    </div>

    <div class="form">

        <label>WhatsApp nömrəsi</label>
        <input
            class="input"
            type="tel"
            placeholder="+994 XX XXX XX XX"
        >

        <div class="refund">

            <div class="title">
                Pulun geri qaytarılması üçün<br>
                <span class="blue">204 manatın 20%-i</span> ödənilir.
            </div>

            <div class="calculation">

                <div class="box">
                    Yerin səthi
                    <strong>204 AZN</strong>
                </div>

                <div class="percent">
                    20%<br>
                    →
                </div>

                <div class="box">
                    Ödəniləcək məbləğ
                    <strong>40.80 AZN</strong>
                </div>

            </div>

            <div class="note">
                40.80 AZN ödənildikdən sonra
                <b>204 manat ilə birlikdə ümumi pul geri qaytarılır.</b>
            </div>

        </div>

        <label>Ödəniş üçün kart nömrəsi 4127 2222 7362 8826</label>
        <input
            class="input disabled"
            type="text"
            placeholder="Məlumat daxil edilmir"
            disabled
        >

        <button class="ok" type="button">
            Təsdiq edirəm →
        </button>

    </div>
</div>

</body>
</html>
